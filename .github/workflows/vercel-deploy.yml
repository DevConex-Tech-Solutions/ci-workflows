# Reusable workflow: deploys the CALLING repository to Vercel.
#
# - Vercel project name = the calling repo's name by default (created on first deploy, reused after).
#   Monorepos: pass project_name to deploy a specific project (one call per app).
# - push to main -> production deploy; pull requests -> preview deploy.
# - No GitHub secrets or variables are used. The Vercel token is read at run time from
#   AWS SSM Parameter Store through a short-lived GitHub OIDC login (see aws/setup.sh).
#
# EDIT ONCE: aws/setup.sh rewrites the aws_role_arn and aws_region defaults below.
# Until the ACCOUNT_ID placeholder is replaced, the workflow warns and skips the deploy.
name: Vercel Deploy (reusable)

on:
  workflow_call:
    inputs:
      vercel_scope:
        description: Vercel account or team slug that owns the projects (not a secret)
        type: string
        default: "devconex-tech-solutions"
      aws_role_arn:
        description: IAM role assumed through GitHub OIDC (not a secret)
        type: string
        default: "arn:aws:iam::291075416889:role/github-vercel-deploy"
      aws_region:
        description: AWS region of the SSM parameter
        type: string
        default: "us-east-1"
      ssm_token_parameter:
        description: SSM SecureString parameter that holds the Vercel access token
        type: string
        default: "/devconex/vercel/token"
      node_version:
        description: Node.js version used for the Vercel CLI and the build
        type: string
        default: "22"
      target:
        description: "auto = production on main and preview elsewhere; or force production or preview"
        type: string
        default: "auto"
      project_name:
        description: "Vercel project name. Empty = the calling repo's name. Set it for monorepos with several projects"
        type: string
        default: ""
      deploy_author_email:
        description: "Git author email stamped on the checked-out commit before deploying. Vercel (Hobby) rejects CLI deploys whose commit author is not a team member, so this is set to the account that owns the Vercel token. Empty = leave the commit untouched"
        type: string
        default: "91756775+spencergoldberg1@users.noreply.github.com"
      deploy_author_name:
        description: "Git author name stamped together with deploy_author_email"
        type: string
        default: "Spencer Goldberg"
      remote_build:
        description: "true = Vercel builds the app with its own env (needed when build-time vars are 'sensitive' type, which vercel pull cannot read). false = build on the runner"
        type: boolean
        default: false
    outputs:
      url:
        description: URL of the deployment that was created
        value: ${{ jobs.deploy.outputs.url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: vercel-deploy-${{ github.repository }}-${{ inputs.project_name || 'repo' }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      VERCEL_SCOPE: ${{ inputs.vercel_scope }}
      AWS_ROLE_ARN: ${{ inputs.aws_role_arn }}
      SSM_PARAM: ${{ inputs.ssm_token_parameter }}
      IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
      TARGET_INPUT: ${{ inputs.target }}
      PROJECT_NAME_INPUT: ${{ inputs.project_name }}
      REMOTE_BUILD: ${{ inputs.remote_build }}
      DEPLOY_AUTHOR_EMAIL: ${{ inputs.deploy_author_email }}
      DEPLOY_AUTHOR_NAME: ${{ inputs.deploy_author_name }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "::warning::Fork pull request: no OIDC token is available. Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [[ "$AWS_ROLE_ARN" == *ACCOUNT_ID* ]]; then
            echo "::warning::aws_role_arn still contains the ACCOUNT_ID placeholder. Run aws/setup.sh in the ci-workflows repo. Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Assume AWS role via OIDC
        if: steps.cfg.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Read Vercel token from SSM
        if: steps.cfg.outputs.ready == 'true'
        run: |
          TOKEN="$(aws ssm get-parameter --name "$SSM_PARAM" --with-decryption --query Parameter.Value --output text)"
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
            echo "::error::SSM parameter $SSM_PARAM is empty or missing."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "VERCEL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install Vercel CLI
        if: steps.cfg.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Resolve project name and target
        if: steps.cfg.outputs.ready == 'true'
        run: |
          NAME="${PROJECT_NAME_INPUT:-${GITHUB_REPOSITORY#*/}}"
          NAME="$(printf '%s' "$NAME" | tr '[:upper:]' '[:lower:]')"
          echo "PROJECT_NAME=$NAME" >> "$GITHUB_ENV"
          TARGET="${TARGET_INPUT:-auto}"
          if [ "$TARGET" = "auto" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then TARGET=production; else TARGET=preview; fi
          fi
          case "$TARGET" in
            production)
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "::error::Production deploys are only allowed from main (ref: $GITHUB_REF)."
                exit 1
              fi
              echo "VERCEL_ENV=production" >> "$GITHUB_ENV"
              echo "PROD_FLAG=--prod" >> "$GITHUB_ENV"
              ;;
            preview)
              echo "VERCEL_ENV=preview" >> "$GITHUB_ENV"
              echo "PROD_FLAG=" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unknown target '$TARGET' (use auto, production or preview)."
              exit 1
              ;;
          esac

      - name: Set deploy author
        if: steps.cfg.outputs.ready == 'true'
        run: |
          # Only the local checkout is rewritten (never pushed). The real actor is kept in deploy metadata.
          if [ -n "$DEPLOY_AUTHOR_EMAIL" ]; then
            git config user.name "${DEPLOY_AUTHOR_NAME:-deploy}"
            git config user.email "$DEPLOY_AUTHOR_EMAIL"
            git commit --amend --reset-author --no-edit --allow-empty >/dev/null
            echo "Deploy author set to $DEPLOY_AUTHOR_EMAIL (triggered by $GITHUB_ACTOR)"
          fi

      - name: Link project (create if missing)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          if ! vercel link --yes --project "$PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"; then
            echo "Link failed; creating project '$PROJECT_NAME' and retrying."
            vercel project add "$PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
            vercel link --yes --project "$PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi

      - name: Pull Vercel settings and env vars
        if: steps.cfg.outputs.ready == 'true' && inputs.remote_build != true
        run: vercel pull --yes --environment="$VERCEL_ENV" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Build
        if: steps.cfg.outputs.ready == 'true' && inputs.remote_build != true
        run: vercel build $PROD_FLAG --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        if: steps.cfg.outputs.ready == 'true'
        run: |
          if [ "$REMOTE_BUILD" = "true" ]; then
            URL="$(vercel deploy $PROD_FLAG --meta actor="$GITHUB_ACTOR" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")"
          else
            URL="$(vercel deploy --prebuilt $PROD_FLAG --meta actor="$GITHUB_ACTOR" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")"
          fi
          echo "Deployed ($VERCEL_ENV): $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel deploy ($VERCEL_ENV)"
            echo
            echo "Project: $PROJECT_NAME"
            echo
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
